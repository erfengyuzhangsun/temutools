# HTTP
server {
    listen 80;
    server_name www.jinpuhuang.com jinpuhuang.com;
    client_max_body_size 50M;

    location /assets/ {
        proxy_pass http://app:8080;
        proxy_cache_valid 200 302 24h;
        add_header Cache-Control "public, immutable, max-age=86400";
        expires 24h;
    }

    location /api/v1/auth/login {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS（Let's Encrypt）
server {
    listen 443 ssl http2;
    server_name www.jinpuhuang.com jinpuhuang.com;

    ssl_certificate /etc/letsencrypt/live/www.jinpuhuang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jinpuhuang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /assets/ {
        proxy_pass http://app:8080;
        proxy_cache_valid 200 302 24h;
        add_header Cache-Control "public, immutable, max-age=86400";
        expires 24h;
    }

    location /api/v1/auth/login {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
