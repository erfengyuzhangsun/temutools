# ===== Nginx 限流 + 反向代理 =====
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=whole:10m rate=10r/s;

# 日志格式
log_format json escape=json '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr",'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"'
  '}';

access_log /var/log/nginx/access.log json;
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name www.jinpuhuang.com jinpuhuang.com;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # 静态资源缓存
    location /assets/ {
        proxy_pass http://temu-upstream;
        proxy_cache_valid 200 302 24h;
        add_header Cache-Control "public, immutable, max-age=86400";
        expires 24h;
    }

    # API: 限流 + 反代
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: 所有非API请求走前端
    location / {
        limit_req zone=whole burst=20 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS（证书就绪后自动生效）
server {
    listen 443 ssl http2;
    server_name www.jinpuhuang.com jinpuhuang.com;

    ssl_certificate /etc/letsencrypt/live/www.jinpuhuang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jinpuhuang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /assets/ {
        proxy_pass http://temu-upstream;
        proxy_cache_valid 200 302 24h;
        add_header Cache-Control "public, immutable, max-age=86400";
        expires 24h;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=whole burst=20 nodelay;
        proxy_pass http://temu-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
